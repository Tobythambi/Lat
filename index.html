<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>AR Wall — 20 Picture AR</title>
<style>
  html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden;
    background:#000; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  #container { position:absolute; inset:0; z-index:0; }
  #container video, #container canvas { position:absolute; top:0; left:0; width:100%; height:100%; }

  #overlay {
    position:absolute; top:0; left:0; right:0; padding:14px 16px;
    display:flex; flex-direction:column; gap:6px; pointer-events:none;
    z-index:20;
  }
  #title { color:#fff; font-size:15px; font-weight:600; text-shadow:0 1px 4px rgba(0,0,0,.8); }
  #status { color:#e6e6e8; font-size:12.5px; line-height:1.4; max-width:520px; text-shadow:0 1px 4px rgba(0,0,0,.8); }

  #badge {
    position:absolute; top:14px; right:16px; z-index:20;
    background:rgba(0,0,0,0.4); color:#fff; font-size:11px;
    padding:5px 10px; border-radius:999px; backdrop-filter:blur(6px);
  }

  #foundBanner {
    position:absolute; bottom:24px; left:0; right:0; text-align:center;
    z-index:20; pointer-events:none; transition:opacity .3s ease;
  }
  #foundBanner span {
    background:rgba(0,0,0,0.55); color:#fff; font-size:12.5px;
    padding:8px 16px; border-radius:999px; backdrop-filter:blur(6px);
  }

  #loading {
    position:absolute; inset:0; display:none; align-items:center; justify-content:center;
    flex-direction:column; gap:12px; color:#fff; background:#000; z-index:30;
  }
  .spinner {
    width:34px; height:34px; border-radius:50%;
    border:3px solid rgba(255,255,255,0.2); border-top-color:#fff;
    animation:spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform:rotate(360deg); } }

  #errorBox {
    position:absolute; inset:0; display:none; align-items:center; justify-content:center;
    flex-direction:column; gap:10px; color:#fff; background:#000; z-index:40;
    padding:24px; text-align:center;
  }

  #welcomeScreen {
    position:absolute; inset:0; z-index:50;
    display:flex; align-items:center; justify-content:center;
    flex-direction:column; gap:22px;
    background-image: url('./assets/welcome.png');
    background-size: cover;
    background-position: center;
    background-color: #111;
  }
  #welcomeScreen::before {
    content: '';
    position:absolute; inset:0;
    background: linear-gradient(180deg, rgba(0,0,0,0.15) 0%, rgba(0,0,0,0.55) 65%, rgba(0,0,0,0.75) 100%);
  }
  #welcomeContent {
    position:relative; z-index:1;
    display:flex; flex-direction:column; align-items:center; gap:18px;
    padding: 0 24px;
  }
  #welcomeTitle {
    color:#fff; font-size:22px; font-weight:700; text-align:center;
    text-shadow:0 2px 8px rgba(0,0,0,.6);
  }
  #startBtn {
    background:#fff; color:#111; border:none; border-radius:999px;
    padding:14px 32px; font-size:15px; font-weight:700; cursor:pointer;
    box-shadow:0 6px 20px rgba(0,0,0,.4);
    animation: pulse 1.8s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.05); }
  }

  /* Custom scanning viewfinder (replaces MindAR's default static one) */
  #scanFrame {
    position:absolute; z-index:10; pointer-events:none;
    top:50%; left:50%; transform:translate(-50%,-50%);
    width:min(78vw, 78vh); aspect-ratio:1/1;
    transition: opacity .35s ease;
  }
  #scanFrame.hidden { opacity:0; }
  .corner {
    position:absolute; width:34px; height:34px;
    border:3px solid #fff;
    filter: drop-shadow(0 0 6px rgba(255,255,255,0.5));
    animation: cornerGlow 2.2s ease-in-out infinite;
  }
  .corner.tl { top:0; left:0; border-right:none; border-bottom:none; }
  .corner.tr { top:0; right:0; border-left:none; border-bottom:none; }
  .corner.bl { bottom:0; left:0; border-right:none; border-top:none; }
  .corner.br { bottom:0; right:0; border-left:none; border-top:none; }
  @keyframes cornerGlow {
    0%, 100% { filter: drop-shadow(0 0 4px rgba(255,255,255,0.35)); }
    50% { filter: drop-shadow(0 0 12px rgba(255,255,255,0.9)); }
  }
  #scanLine {
    position:absolute; left:6%; right:6%; height:2px;
    background: linear-gradient(90deg, transparent, #fff 20%, #fff 80%, transparent);
    box-shadow: 0 0 8px 1px rgba(255,255,255,0.8);
    animation: scanMove 2.4s cubic-bezier(.45,0,.55,1) infinite;
  }
  @keyframes scanMove {
    0%   { top: 6%; opacity: 0; }
    8%   { opacity: 1; }
    50%  { top: 94%; opacity: 1; }
    92%  { opacity: 1; }
    100% { top: 6%; opacity: 0; }
  }

  #unmuteBtn {
    position:absolute; bottom:90px; left:0; right:0; z-index:20;
    display:flex; justify-content:center; pointer-events:none;
  }
  #unmuteBtn button {
    pointer-events:auto;
    background:#fff; color:#111; border:none; border-radius:999px;
    padding:10px 20px; font-size:13px; font-weight:600; cursor:pointer;
    box-shadow:0 4px 16px rgba(0,0,0,.35); display:block;
  }
</style>
</head>
<body>

<div id="loading">
  <div class="spinner"></div>
  <div style="font-size:13px; color:#c9c9d1;">Starting camera…</div>
</div>

<div id="errorBox">
  <div style="font-size:15px; font-weight:600;">Couldn't start AR</div>
  <div id="errorMsg" style="font-size:12.5px; color:#c9c9d1; max-width:320px;"></div>
</div>

<div id="welcomeScreen">
  <div id="welcomeContent">
    <div id="welcomeTitle">Welcome to the AR Wall</div>
    <button id="startBtn">Tap here for experience</button>
  </div>
</div>

<div id="container"></div>

<div id="scanFrame" class="hidden">
  <div class="corner tl"></div>
  <div class="corner tr"></div>
  <div class="corner bl"></div>
  <div class="corner br"></div>
  <div id="scanLine"></div>
</div>

<div id="overlay">
  <div id="title">AR Wall — 20 Picture AR</div>
  <div id="status">Point your camera at a picture.</div>
</div>

<div id="badge">MindAR · 20 targets</div>

<div id="foundBanner" style="opacity:0;"><span id="foundBannerText">Target found</span></div>

<div id="unmuteBtn"><button id="unmuteBtnInner">🔊 Tap for sound</button></div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.150.1/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.150.1/examples/jsm/",
    "mindar-image-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"
  }
}
</script>

<script type="module">
  import * as THREE from "three";
  import { MindARThree } from "mindar-image-three";

  const TARGET_MIND_URL = "./targets.mind"; // contains all 20 targets, compiled together, index 0-19

  // Bump this any time you replace a video or targets.mind and push an
  // update — it forces visitors' browsers to fetch the new file instead of
  // serving a stale cached copy. Just change the date/number, no other edits needed.
  const ASSET_VERSION = "2026-08-29-2";
  const withVersion = (path) => `${path}?v=${ASSET_VERSION}`;

  // One entry per picture, index 0-19, verified 1:1 with the compiled
  // targets.mind (01.jpg -> index 0, 02.jpg -> index 1, ... 20.jpg -> index 19).
  // Manual overrides below: which video plays for a given index, when it's
  // not simply target-<index>.mp4 (e.g. content was swapped between pictures).
  const VIDEO_OVERRIDES = {
    2: './media/target-3.mp4',  // 03.jpg
    3: './media/target-4.mp4',  // 04.jpg
    4: './media/target-2.mp4',  // 05.jpg
  };
  const ITEMS = Array.from({ length: 20 }, (_, i) => ({
    index: i,
    videoUrl: withVersion(VIDEO_OVERRIDES[i] || `./media/target-${i}.mp4`),
    width: 1.2,
  }));

  const loadingEl = document.getElementById('loading');
  const errorBox = document.getElementById('errorBox');
  const errorMsg = document.getElementById('errorMsg');
  const statusEl = document.getElementById('status');
  const foundBanner = document.getElementById('foundBanner');
  const foundBannerText = document.getElementById('foundBannerText');
  const unmuteBtn = document.getElementById('unmuteBtnInner');

  let allVideos = [];
  let audioUnlocked = false;
  unmuteBtn.addEventListener('click', () => {
    audioUnlocked = true;
    allVideos.forEach(v => { v.muted = false; });
    unmuteBtn.textContent = '🔊 Sound on';
    setTimeout(() => { document.getElementById('unmuteBtn').style.display = 'none'; }, 1200);
  });

  window.addEventListener('error', (e) => {
    const el = document.getElementById('status');
    if (el) el.textContent = 'JS error: ' + (e.message || 'unknown');
  });

  let mindarThree, renderer, scene, camera;
  let activeCount = 0;

  document.getElementById('startBtn').addEventListener('click', () => {
    document.getElementById('welcomeScreen').style.display = 'none';
    document.getElementById('loading').style.display = 'flex';
    init();
  });

  async function init() {
    try {
      mindarThree = new MindARThree({
        container: document.querySelector("#container"),
        imageTargetSrc: withVersion(TARGET_MIND_URL),
        uiScanning: "no",
        uiLoading: "no",
        filterMinCF: 0.00005,
        filterBeta: 0.0008,
        missTolerance: 24,
        warmupTolerance: 5,
      });

      renderer = mindarThree.renderer;
      renderer.setClearColor(0x000000, 0);
      scene = mindarThree.scene;
      camera = mindarThree.camera;

      const hemi = new THREE.HemisphereLight(0xffffff, 0x333333, 1.2);
      scene.add(hemi);
      const dir = new THREE.DirectionalLight(0xffffff, 1.0);
      dir.position.set(0.5, 1, 1);
      scene.add(dir);

      ITEMS.forEach((item, i) => {
        const anchor = mindarThree.addAnchor(item.index);
        const videoPlane = setupVideoPlane(item.videoUrl, item.width);
        anchor.group.add(videoPlane.mesh);
        allVideos.push(videoPlane.video);
        if (audioUnlocked) videoPlane.video.muted = false;

        anchor.onTargetFound = () => {
          activeCount++;
          updateStatus();
          flashBanner(`Picture ${i + 1} found → playing ${item.videoUrl}`);
          videoPlane.video.currentTime = 0;
          videoPlane.video.play().catch(() => {});
        };
        anchor.onTargetLost = () => {
          activeCount = Math.max(0, activeCount - 1);
          updateStatus();
          videoPlane.video.pause();
        };
      });

      await mindarThree.start();
      loadingEl.style.display = 'none';
      document.getElementById('scanFrame').classList.remove('hidden');
      updateStatus();

      renderer.setAnimationLoop(() => {
        renderer.render(scene, camera);
      });
    } catch (err) {
      loadingEl.style.display = 'none';
      errorBox.style.display = 'flex';
      errorMsg.textContent = err && err.message ? err.message : 'Camera or tracking failed to start.';
    }
  }

  function updateStatus() {
    const scanFrame = document.getElementById('scanFrame');
    statusEl.textContent = activeCount > 0
      ? `${activeCount} of ${ITEMS.length} pictures recognized — playing.`
      : `Point your camera at a picture. ${ITEMS.length} pictures set up.`;
    if (activeCount > 0) {
      scanFrame.classList.add('hidden');
    } else {
      scanFrame.classList.remove('hidden');
    }
  }

  let bannerTimeout;
  function flashBanner(text) {
    foundBannerText.textContent = text;
    foundBanner.style.opacity = '1';
    clearTimeout(bannerTimeout);
    bannerTimeout = setTimeout(() => { foundBanner.style.opacity = '0'; }, 1200);
  }

  function setupVideoPlane(videoUrl, widthUnits) {
    const video = document.createElement('video');
    video.src = videoUrl;
    video.crossOrigin = 'anonymous';
    video.loop = true;
    video.muted = true;
    video.playsInline = true;
    video.setAttribute('webkit-playsinline', 'true');

    const texture = new THREE.VideoTexture(video);
    texture.colorSpace = THREE.SRGBColorSpace || texture.colorSpace;

    const group = new THREE.Group();

    // Frame (ivory border), sits just behind the video plane.
    const FRAME_MARGIN = widthUnits * 0.045; // thin border, ~4.5% of width per side
    const frameMaterial = new THREE.MeshBasicMaterial({ color: 0xf5f0e6, side: THREE.DoubleSide });
    let frameHeight = widthUnits * (9 / 16) + FRAME_MARGIN * 2;
    const frameGeometry = new THREE.PlaneGeometry(widthUnits + FRAME_MARGIN * 2, frameHeight);
    const frameMesh = new THREE.Mesh(frameGeometry, frameMaterial);
    frameMesh.position.z = -0.003;
    group.add(frameMesh);

    // Video plane, placeholder 16:9 until metadata loads.
    let planeHeight = widthUnits * (9 / 16);
    const geometry = new THREE.PlaneGeometry(widthUnits, planeHeight);
    const material = new THREE.MeshBasicMaterial({ map: texture, side: THREE.DoubleSide });
    const mesh = new THREE.Mesh(geometry, material);
    group.add(mesh);

    video.addEventListener('loadedmetadata', () => {
      const aspect = video.videoWidth / video.videoHeight;
      const realHeight = widthUnits / aspect;

      mesh.geometry.dispose();
      mesh.geometry = new THREE.PlaneGeometry(widthUnits, realHeight);

      frameMesh.geometry.dispose();
      frameMesh.geometry = new THREE.PlaneGeometry(
        widthUnits + FRAME_MARGIN * 2,
        realHeight + FRAME_MARGIN * 2
      );
    });

    return { mesh: group, video };
  }
</script>
</body>
</html>
